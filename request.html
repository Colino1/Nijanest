<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="assets/leaflet.css"><script src="assets/leaflet.js"></script><script src="app.js"></script></head><body><script>shell("Request an inspection")</script>
<main class="wrap page"><h1 style="font-size:2rem;margin-bottom:6px">Request an inspection</h1><p class="hint" id="li"></p>
<form class="f" id="f"><div><label for="n">Your name</label><input id="n" required></div><div><label for="p">Your phone number</label><input id="p" type="tel" required></div><div><label for="d">Preferred day and time</label><input id="d" placeholder="e.g. Saturday, 11am"></div><button class="btn go" type="submit">Create my inspection request</button><div class="msg err" id="m"></div></form>
<ol class="steps"><li><b>You request.</b> It is free.</li><li><b>We ask the landlord.</b> We tell you when they accept.</li><li><b>You pay the booking fee to NaijaNest.</b> Never to the landlord or contact person.</li><li><b>We release the contact</b> so you can message them and confirm the viewing.</li></ol></main>
<script>const X=LISTINGS.find(x=>x.id===q("id"));$("li").textContent=X?X.title+", "+X.area+", "+N(X.rent)+" per year":"Pick a listing first.";
$("f").onsubmit=e=>{e.preventDefault();if(!X){$("m").style.display="block";$("m").textContent="Go back and choose a listing.";return}
const r=rid("NN"),d=S.get("nn_deals",{});d[r]={ref:r,id:X.id,title:X.title,name:$("n").value.trim(),phone:$("p").value.trim(),day:$("d").value.trim(),stage:1};S.set("nn_deals",d);location.href="deal.html?ref="+r}</script></body></html>
